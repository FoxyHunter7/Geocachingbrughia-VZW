services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: geocaching-backend
    restart: unless-stopped
    volumes:
      - geocaching-data:/data:rw
    environment:
      - DATABASE_PATH=/data/geocaching.db
      - PORT=8080
      - ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=24
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
      - REMINDER_DAYS=${REMINDER_DAYS:-3}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://geocachingbrughia.be,http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-https://geocachingbrughia.be}
    networks:
      - geocaching-network
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        - VITE_API_URL=/api/
    container_name: geocaching-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro  # For SSL certificates
    depends_on:
      - backend
    networks:
      - geocaching-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================
  # PRETIX TICKETING STACK
  # Data persists in named volumes — survives updates.
  # See AGENTS.md §13 before touching anything here.
  # =============================================

  pretix-db:
    image: postgres:15-alpine
    container_name: geocaching-pretix-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pretix
      - POSTGRES_USER=pretix
      - POSTGRES_PASSWORD=${PRETIX_DB_PASSWORD}
    volumes:
      - pretix-db-data:/var/lib/postgresql/data
    networks:
      - geocaching-network
    security_opt:
      - no-new-privileges:true

  pretix-redis:
    image: redis:7-alpine
    container_name: geocaching-pretix-redis
    restart: unless-stopped
    networks:
      - geocaching-network
    security_opt:
      - no-new-privileges:true

  pretix:
    image: pretix/standalone:stable
    container_name: geocaching-pretix
    restart: unless-stopped
    depends_on:
      - pretix-db
      - pretix-redis
    volumes:
      - pretix-data:/data:rw
      - ./pretix/pretix.cfg:/etc/pretix/pretix.cfg:ro
    networks:
      - geocaching-network

networks:
  geocaching-network:
    driver: bridge

volumes:
  geocaching-data:
    # GeocachingBrughia backend SQLite database
  pretix-data:
    # Pretix media files, cached data — PERSIST THIS
  pretix-db-data:
    # Pretix PostgreSQL database — PERSIST THIS (orders, events, tickets)
